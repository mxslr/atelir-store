      rel="stylesheet"
    />
    <title>Jasa Website Profesional Murah Premium | Atelir</title>

    <!--
      Structured data (JSON-LD) tipe ProfessionalService.
      Membantu Google memahami bahwa situs ini penyedia jasa.
      GANTI bagian bertanda PEMILIK di bawah:
      - telephone: nomor WhatsApp format internasional (sudah diisi, sesuaikan bila berubah).
      - logo / image: taruh file logo di folder public lalu sesuaikan URL-nya.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Atelir",
        "description": "Jasa pembuatan website murah dengan tampilan premium, dibuat dari nol tanpa template. Melayani website, chatbot, dan AI.",
        "url": "https://www.atelir.store/",
        "image": "https://www.atelir.store/og.png",
        "logo": "https://www.atelir.store/og.png",
        "telephone": "+62812818813",
        "priceRange": "$$",
        "areaServed": {
          "@type": "Country",
          "name": "Indonesia"
        },
        "serviceType": [
          "Jasa pembuatan website",
          "Jasa chatbot",
          "Jasa AI"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
